# The open moss CLI (open-CLI slice 3): `moss build` with no
# window system anywhere in the dependency graph. check-crate-dag.mjs arms its
# moss-cli rule on this crate's existence — no tauri/wry, and never the app
# crate.
[package]
name = "moss-cli"
version = "0.15.24-dev"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The open moss CLI: build a moss site headless, no webview runtime"
publish = false

[lints]
workspace = true

[[bin]]
name = "moss-cli"
path = "src/main.rs"

[dependencies]
moss-build = { path = "../moss-build" }
# The app binary loads `.env` before dispatch (the desktop app's `main.rs`), so a
# crossed verb reading `MOSS_ENV`/`MOSS_SETA_URL` saw a developer's local
# environment there and production here. Same crate, same call, same answer.
dotenvy = "0.15"
# `UpdaterManifest` (`latest.json`) parsing, and the outer base64 layer both
# `pubkey` and a manifest signature are wrapped in. Same version strings as
# moss-build's, already in the lock via it — no new crate, no version bump.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

# Gzips the embedded browser UI; already in the lock via moss-build.
[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
# Drives a served `moss edit` over HTTP in the socket tests; already in the lock
# via moss-build.
ureq = { version = "2", features = ["json"] }
# Only the fixture builders in `desktop_tests.rs` and the embedded bundle's
# gzip check use these. Same version strings as moss-build's, already in the
# lock — no new crate, no version bump.
flate2 = "1"
tar = "0.4"
