# earth_gebco_03m_g ships as eight 90x90-degree gridline-registered tiles
# (lossless, signed 16-bit JPEG2000) rather than one file; the fine tier
# contours this dataset at native resolution. Tile naming gives the
# southwest corner: N00 spans lat 0..90, S90 spans lat -90..0;
# E000/E090/W090/W180 each span 90 degrees of longitude starting at that
# corner. Stored values are whole metres (elevation_scale_metres).

