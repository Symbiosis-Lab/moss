[package]
name = "moss-build"
version = "0.8.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI-free build pipeline for moss. Seeded with vault-root identity and the .moss layout; the pipeline moves in at M6a."
publish = false

[lints]
workspace = true

[features]
# `MossPaths::ensure_dirs` — a `.moss` skeleton builder with zero production
# callers, kept as a test fixture (see its doc comment). Enabled ONLY from
# the desktop app's `[dev-dependencies]`, so it stays absent from every shipped build.
test-fixtures = []

# No tauri or wry, direct or transitive — enforced by scripts/check-crate-dag.mjs
# (rule armed on this crate's existence). Likewise no dependency on the app crate.
[dependencies]
moss-core = { workspace = true, features = ["specta", "cjk-friendly-emphasis"] }
# `VaultRoot::find_containing_in` bounds its `.moss/` ancestor walk at the user's
# home directory — same dep the app crate uses for the same guard.
dirs = "5.0"
# `moss_paths` logs best-effort cloud-exclusion failures; the app crate initialises
# the logger, this crate only emits.
log = "0.4"

# `config.rs` reads `.moss/config.toml`. Same version as the desktop app's so
# the crate is compiled once for the workspace. The settings writers stay
# app-side; `toml_edit` is here for `infra::toml_rewrite`, the surgical editor
# the plugin uninstaller uses to drop a plugin's keys without touching the
# user's comments.
toml = "0.8"
toml_edit = { version = "0.20", default-features = false }
# `plugins::install` compares manifest versions against the running moss.
semver = "1"

# The config vocabulary (`config/{services,deployment,environment}.rs`) is
# serde-mapped from the toml text; specta rides the crossed vocabulary for the
# Tauri bindings (required since M6a — the moved types derive it outright).
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde_json", "chrono"] }
# `advisory::Action::InApp` carries op-specific arguments as free-form JSON.
# Already in the workspace tree via the desktop app, so this duplicates nothing.
serde_json = "1"

# ── The build tree's dependencies (M6a move, 2026-08-28) ─────────────────────
# Copied verbatim from the desktop app's Cargo.toml so each crate is compiled
# once for the workspace. Versions and feature sets must stay aligned with the app's;
# `cargo tree -d` is the check.
base64 = "0.21"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
fast_qr = { version = "0.12", default-features = false, features = ["svg"] }
flate2 = "1"
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Already in the tree transitively via jieba-rs; version must keep matching
# what Cargo.lock resolves there (`cargo tree -d` is the check).
include-flate = "0.3.4"
include_dir = "0.7"
jieba-rs = "0.10"
k256 = { version = "0.13", features = ["schnorr", "ecdsa"] }
kamadak-exif = "0.5"
lol_html = "1.2"
notify = "6.1"
notify-debouncer-full = "0.3"
percent-encoding = "2"
pulldown-cmark = "0.13"
rand = "0.8"
ratex-parser = "=0.1.13"
ratex-layout = "=0.1.13"
ratex-svg = { version = "=0.1.13", features = ["standalone", "embed-fonts"] }
rayon = "1.11"
regex = "1.12.2"
resvg = { version = "0.42", default-features = false, features = ["text", "system-fonts"] }
scraper = "0.20"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
tar = "0.4"
thiserror = "1.0"
tiny-skia = "0.11"
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
# `vault::fs::delete_entry_inner` — recoverable OS-trash delete shared by the
# desktop command and the HTTP mutation arm. Same version as the desktop app's.
trash = "5"
ureq = { version = "2", features = ["json", "tls", "socks-proxy"] }
# The async client the moss-seta half of this crate is written on.
# "socks" mirrors ureq's "socks-proxy" so both clients honour the same system
# proxy. reqwest 0.13 resolves to hyper 1.x, which the tree requires.
reqwest = { version = "0.13", features = ["json", "query", "socks"] }
url = "2.4"
urlencoding = "2.1"
usvg = { version = "0.42", default-features = false, features = ["text", "system-fonts"] }
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.4"
whatlang = "0.18.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = "0.6"
ammonia = "4"
async-trait = "0.1"
color_quant = "1.1"
hex = "0.4"
libc = "0.2"
pagefind = { version = "1.5.2", default-features = false }
png = "0.18"
serde_yaml = "0.9"
ttf-parser = "0.21"
webp = "0.3"
# Prod use too: `build::feeds::search` unpacks the pagefind bundle via a tempdir.
tempfile = "3.0"

# ── The QuickJS plugin engine (open-CLI slice 2) ──────────────────────────────
# futures⇄ES Promises + drive(); `macro` → #[rquickjs::function] host fns.
rquickjs = { version = "=0.12.0", features = ["futures", "macro"] }
# `plugins::runtime::portable::html_to_markdown` — the engine's markdown arm.
htmd = "=0.5.4"
# The engine's Promise plumbing (`FutureExt::catch_unwind` around hook dispatch).
futures = "0.3"
# `identity::keystore` — the file-based vault keypair store.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize"] }

# ── The preview server (ops/serve, S1 server relocation) ─────────────────────
# Exactly the desktop app's versions and feature sets so each crate compiles
# once for the workspace (`cargo tree -d` is the check). hyper-1.x stack only.
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
http-body-util = "0.1"

# `exclude_from_cloud_sync` sets the File Provider ignore xattr — an Apple subsystem,
# so the dep is target-gated and the function is a no-op elsewhere. Last on
# purpose: a `[target.…]` table ends `[dependencies]`, so a plain dep written
# below it would silently become macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
# `platform/{iopolicy,file_coordination}` (M6a move): Foundation file
# coordination + the file-provider I/O policy. Feature sets mirror the desktop app's.
core-foundation = "0.9"
core-foundation-sys = "0.8"
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSFileCoordinator", "NSURL", "NSString", "NSError", "NSNotification", "NSOperation", "NSArray", "NSSet", "NSData", "NSDate", "NSRunLoop", "block2"] }
# The `block2` in objc2-foundation's feature list above is a feature flag, not
# this crate — it only makes objc2-foundation's block-taking APIs available.
# `file_coordination` names `block2::RcBlock` itself, so it needs the dep.
block2 = "0.6"
# `build::media::symlink` computes the relative target of a synthesized alias
# symlink — inside `handle_alias_entry`, which is macOS-only (the other arm is a
# detect-and-skip stub). Moved here from the desktop app, which no longer uses it.
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
brotli = "8"
roxmltree = "0.20"
# vault_root_tests.rs mints unique temp dirs per test.
uuid = { version = "1.11", features = ["v4"] }
# The moved build tree's inline tests (M6a).
filetime = "0.2"
proptest = "1.5"
tokio = { version = "1.0", features = ["rt", "macros", "test-util"] }
# engine/acceptance.rs: the fetch_url wire-shape gate runs against a local server.
mockito = "1.4"
