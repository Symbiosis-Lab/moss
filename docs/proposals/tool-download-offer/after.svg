<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <title>Advisory card with the download offer</title>
  <rect x="0" y="0" width="560" height="260" fill="#ffffff"/>
  <rect x="20" y="20" width="520" height="220" rx="8" fill="#f2f2f2" stroke="#8a8a8a"/>
  <rect x="40" y="40" width="480" height="36" rx="4" fill="#d9d9d9"/>
  <text x="52" y="63" font-size="15" font-weight="600" fill="#222">FFmpeg not available</text>
  <rect x="40" y="90" width="480" height="62" rx="4" fill="#e6e6e6"/>
  <text x="52" y="112" font-size="13" fill="#333">moss can download FFmpeg (size) to shrink videos.</text>
  <text x="52" y="128" font-size="13" fill="#333">Used for video compression and reading video size.</text>
  <text x="52" y="144" font-size="13" fill="#333">Until you download it, videos ship at full size.</text>
  <rect x="40" y="170" width="120" height="30" rx="4" fill="#4a4a4a"/>
  <text x="100" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Download</text>
</svg>
