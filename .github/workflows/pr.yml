# The pull request gate. It runs on a pull request to `develop`, the default
# branch and the one a contribution targets, and on a pull request to `main`.
# A push to `develop` runs none of it.
#
# There is no change-detection job: every job below runs on every pull
# request.

name: PR

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Gate: a moss-api or moss-core code change must land with a CHANGELOG
  # entry describing the change, including finalized release entries.
  # ==========================================================================
  changelogs:
    name: Sub-package changelogs up to date
    # Inherently a diff against the PR base: there is no `base_ref` on a
    # workflow_dispatch, so this would resolve BASE to "origin/" and die.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changelogs for changed sub-packages
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref }}"
          FAIL=0

          # What this gate actually wants: a code change must arrive documented.
          # It used to ask a narrower question — "is [Unreleased] non-empty?" —
          # and that question has no satisfying answer on a release PR. Cutting
          # a release means finalizing the changelog: the entries move OUT of
          # [Unreleased] and under a `## [0.5.1] - 2026-08-07` heading. So the
          # better a release was prepared, the more certainly this failed, and
          # the only way to go green was to leave the changelog unfinalized on
          # main. A finalized version section must therefore be accepted.
          #
          # So: documented means the changelog gained populated content that the
          # base branch does not have — whether under [Unreleased] or under a new
          # version heading. That also covers moss-api's unbracketed `## 0.10.0`;
          # nothing here parses a heading's shape, only whether base already had it.

          # Prints every `## ` heading whose section holds non-whitespace text.
          # Reads the whole file in one awk pass and prints only heading lines,
          # which keeps the output tiny — deliberate. The predecessor piped a
          # whole section into `grep -qv` and was racy under `set -o pipefail`:
          # grep -q exits on the first match and, for sections larger than awk's
          # stdio buffer (~4 KB), awk's next write hits the closed pipe →
          # SIGPIPE → pipefail reports the pipeline as failed → a false "empty"
          # verdict for a large changelog section.
          populated_headings() {
            awk '
              /^## / { if (h != "" && n > 0) print h; h = $0; n = 0; next }
              h != "" && !/^[[:space:]]*$/ { n++ }
              END { if (h != "" && n > 0) print h }
            ' "$1"
          }

          BASE_COPIES=$(mktemp -d)
          trap 'rm -rf "$BASE_COPIES"' EXIT

          has_changelog_content() {
            local file="$1"
            [ -f "$file" ] || { echo "MISSING: $file"; return 1; }

            local now
            now=$(populated_headings "$file")

            # The everyday case: work in flight, entries sitting in [Unreleased].
            if grep -q '^## \[Unreleased\]' <<<"$now"; then return 0; fi

            # The release case: [Unreleased] was drained into a version section
            # that the base branch has never seen.
            local basefile
            basefile="$BASE_COPIES/$(echo "$file" | tr / _)"
            git show "$BASE:$file" > "$basefile" 2>/dev/null || : > "$basefile"
            comm -23 <(sort -u <<<"$now") <(populated_headings "$basefile" | sort -u) \
              | grep -q .
          }

          # Returns true if any non-changelog files changed under a given path.
          code_changed() {
            local path="$1"
            git diff --name-only "$BASE...HEAD" -- "$path" \
              | grep -qv 'CHANGELOG\.md$'
          }

          # --- moss-api ---
          if code_changed "packages/moss-api/"; then
            if has_changelog_content "packages/moss-api/CHANGELOG.md"; then
              echo "✓ moss-api: CHANGELOG documents this change"
            else
              echo "::error file=packages/moss-api/CHANGELOG.md::moss-api code changed but CHANGELOG.md documents nothing new. Add an entry under [Unreleased], or finalize it under a new version heading, before merging to main."
              FAIL=1
            fi
          else
            echo "– moss-api: no code changes"
          fi

          # --- moss-core ---
          if code_changed "crates/moss-core/"; then
            if has_changelog_content "crates/moss-core/CHANGELOG.md"; then
              echo "✓ moss-core: CHANGELOG documents this change"
            else
              echo "::error file=crates/moss-core/CHANGELOG.md::moss-core code changed but CHANGELOG.md documents nothing new. Add an entry under [Unreleased], or finalize it under a new version heading, before merging to main."
              FAIL=1
            fi
          else
            echo "– moss-core: no code changes"
          fi

          exit $FAIL

  # ==========================================================================
  # Rust tests for the three crates. Authored fresh, not lifted: the desktop's
  # own `rust-tests` (pr.yml:862-1055) runs `cargo test --tests --all-features`
  # from the app's own working directory, without `--workspace`, so it is not a
  # template for a workspace-wide pass. Modeled instead on maint.yml's
  # `rust-tests-windows` "Run Rust tests (workspace)" step (maint.yml:750-752,
  # `cargo test --workspace --all-features --no-fail-fast`), scoped to the
  # three open crates. Surrounding scaffolding (checkout, toolchain, cache,
  # apt install, pnpm install) is lifted from `rust-tests` (pr.yml:862-981);
  # the "Build frontend", "Check for duplicate dependencies", and "Verify
  # generated artifacts" steps are dropped — none apply without the desktop app.
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: linux

      # moss-build's own build scripts still probe for libwebkit2gtk even
      # headless (pr.yml:962-975).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_RUST_INSTALL: 1

      - name: Run Rust tests (workspace, scoped to the open crates)
        run: xvfb-run --auto-servernum cargo test --workspace --all-features -p moss-core -p moss-build -p moss-cli --no-fail-fast

  # ==========================================================================
  # Same invocation as .githooks/pre-push:111 and maint.yml's
  # rust-tests-macos "Clippy" step (maint.yml:676-678) — the two places this
  # already exists — scoped to the three crates the same way as rust-tests.
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: linux-clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Clippy (workspace, all targets, all features, open crates)
        run: cargo clippy --workspace --all-targets --all-features -p moss-core -p moss-build -p moss-cli

  # ==========================================================================
  # Lifted verbatim from pr.yml:475-487 ("Rust advisories") — it already runs
  # from repo root with no path assumptions. .cargo/audit.toml here carries
  # the desktop file's advisory-acceptance list trimmed to what applies to
  # these three crates' dependency tree (see that file's own header).
  # ==========================================================================
  cargo-audit:
    name: Rust advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against the RustSec database
        run: cargo audit

  # ==========================================================================
  # Lifted verbatim from pr.yml:627-646 ("moss-core packages cleanly").
  # ==========================================================================
  moss-core-package:
    name: moss-core packages cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify moss-core packages cleanly
        run: |
          cargo package -p moss-core --no-verify
          cd target/package
          tar xzf moss-core-*.crate
          cd moss-core-*/
          cargo build --release

  # ==========================================================================
  # Builds moss-cli for the CLI end-to-end job below. Lifted from pr.yml's
  # "Build the open CLI binary" step (pr.yml:1174-1177); the artifact upload
  # replaces build-app's shared-download shape since this repo has no app
  # binary to ride alongside.
  # ==========================================================================
  build-cli:
    name: Build moss-cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: linux-cli-release

      - name: Build the moss-cli binary
        run: |
          cargo build --release -p moss-cli
          test -f ./target/release/moss-cli || { echo "::error::moss-cli not found after build"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: moss-cli-linux-release
          path: target/release/moss-cli
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # NEW, not lifted — no existing desktop job runs an end-to-end check against
  # moss-cli alone. The app's own CLI-parity test's non-parity
  # assertions cannot run here (there is no app binary in this repo to compare
  # against), so that half of CLI coverage stays desktop-only. The shape below
  # follows pr.yml's `render-gates` job, which already drives `moss-cli`
  # directly via `MOSS_CLI_BIN` (pr.yml:1271-1332) alongside the app: a guide
  # listing, a headless build, and an output-file assertion, matching
  # release.yml's `build-linux-cli` "Verify it runs with no display" step
  # (164-174) in spirit even though that step targets the app binary, not this
  # one.
  # ==========================================================================
  cli-e2e:
    name: CLI end-to-end (headless)
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: moss-cli-linux-release
          path: target/release/

      - name: Restore the executable bit
        run: |
          chmod +x target/release/moss-cli
          ./target/release/moss-cli --version

      - name: List guides (headless)
        run: xvfb-run --auto-servernum ./target/release/moss-cli guide --list

      # No minimal-vault fixture exists under open/ today, and `moss build`
      # has no --output flag (real surface:
      # `moss build <folder> [--serve|--watch|--no-plugins|--allow-plugins|
      # --wait-plugins|--strict|--site-url=<url>]`, crates/moss-build/src/
      # cli/commands.rs). A build writes into `<folder>/.moss/build.nosync/current`
      # (a symlink to the generation directory), not to a path the caller
      # names — verified locally (2026-10-06): `moss-cli build /tmp/vault
      # --no-plugins --strict` against a two-line index.md produced
      # `/tmp/vault/.moss/build.nosync/current/index.html` and exited 0.
      - name: Build a fixture vault (headless)
        run: |
          mkdir -p /tmp/moss-cli-e2e-vault
          cat > /tmp/moss-cli-e2e-vault/index.md <<'EOF'
          ---
          title: index
          ---

          index body
          EOF
          xvfb-run --auto-servernum ./target/release/moss-cli build /tmp/moss-cli-e2e-vault --no-plugins --strict
          test -f /tmp/moss-cli-e2e-vault/.moss/build.nosync/current/index.html || { echo "::error::moss-cli build produced no .moss/build.nosync/current/index.html"; exit 1; }

  # ==========================================================================
  # Lifted wholesale from pr.yml:709-776 ("Packages Tests"), dropping the
  # open/ prefix on every `cd`.
  # ==========================================================================
  test-packages:
    name: Packages Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # verify-accepts --range below walks the PR's own commit range
          # (base.sha..head.sha) one commit at a time; a shallow (default)
          # checkout has only the merge commit GitHub synthesizes and
          # neither SHA is reachable from it as a real commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_RUST_INSTALL: 1

      - name: Backend JS bundles are up to date
        run: pnpm run check:backend-scripts

      # This tree's own copy of the desktop repo's architecture ratchet (rows
      # a/b/e — prod-lines-per-file, children-per-dir, mirror-comment
      # markers).
      # Once the desktop side can no longer scan `open/crates`/`open/packages`,
      # this repo has to ratchet its own tree.
      - name: Ratchet (architecture size/marker budget)
        run: node scripts/ratchet.mjs check

      - name: Ratchet tool tests (accept/tighten --path)
        run: node --test scripts/__tests__/ratchet.test.mjs

      # `check` goes green precisely BECAUSE a ceiling rose, so a raise with
      # no reason is otherwise invisible in review — this audits every
      # commit the PR actually adds (not just its final diff) for a
      # Ratchet-Accept trailer covering each one, the retroactive
      # counterpart to the commit-msg hook that only runs on the
      # contributor's own machine.
      - name: Ratchet accept-trailer audit (PR commit range)
        if: github.event_name == 'pull_request'
        run: node scripts/ratchet.mjs verify-accepts --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Typecheck moss-api (source + tests)
        run: cd packages/moss-api && pnpm run typecheck

      - name: Test moss-api with coverage
        run: cd packages/moss-api && npx vitest run --coverage

      - name: Typecheck moss-syntax (source + tests)
        run: cd packages/moss-syntax && pnpm run typecheck

      - name: Typecheck moss-watercolor (source + tests)
        run: cd packages/moss-watercolor && pnpm run typecheck

      - name: Package artifacts are up to date
        run: |
          pnpm --filter @symbiosis-lab/moss-api run build
          pnpm --filter @symbiosis-lab/moss-syntax run build
          pnpm --filter @symbiosis-lab/moss-watercolor run build
          if ! git diff --exit-code -- packages/moss-api/dist packages/moss-syntax/dist packages/moss-watercolor/dist; then
            echo "::error::Package artifacts are stale. Run the moss-api, moss-syntax and moss-watercolor builds and commit dist/."
            exit 1
          fi

      - name: Landing's vendored moss-watercolor build is up to date
        run: |
          node scripts/build-site-watercolor.mjs
          if ! git diff --exit-code -- site/vendor/moss-watercolor; then
            echo "::error::site/vendor/moss-watercolor/moss-watercolor.js is stale. Run scripts/build-site-watercolor.mjs and commit it."
            exit 1
          fi

      - name: Test moss-syntax
        run: cd packages/moss-syntax && npx vitest run

      - name: Test moss-watercolor
        run: cd packages/moss-watercolor && npx vitest run

      - name: Test moss npm wrapper
        run: cd packages/moss && npm test

      - name: Test moss-build site/bridge JS (js-src)
        run: cd crates/moss-build && npx vitest run

      - name: Typecheck obsidian-moss (source + tests)
        run: cd packages/obsidian-moss && pnpm run typecheck

      - name: Test obsidian-moss
        run: cd packages/obsidian-moss && npx vitest run

      # main.js is gitignored here and never committed, unlike moss-api's
      # and moss-syntax's dist/, so there is no freshness diff to check —
      # this only proves the esbuild bundle still succeeds.
      - name: Build obsidian-moss
        run: cd packages/obsidian-moss && npm run build

      - name: Verify moss-api API reference is up-to-date
        run: |
          cd packages/moss-api
          pnpm run docs
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            echo "::error::moss-api API reference out of sync with source. Run: cd packages/moss-api && pnpm run docs"
            git status --porcelain -- docs/api
            git diff -- docs/api
            exit 1
          fi

      - uses: codecov/codecov-action@v6
        if: always()
        with:
          files: "packages/moss-api/coverage/lcov.info"
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: packages
          fail_ci_if_error: false
