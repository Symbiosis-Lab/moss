<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>moss editor interface plate</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Plate 01 · Whole to detail</div><h1>The page stays at the center.</h1><p>The complete editor is shown before its parts are named. Each number connects the whole view to an enlarged, readable detail.</p></div><a href="index.html">All studies</a></header><figure class="plate"><div class="overview"><img src="../assets/guides/editor-ui-source.png" alt="moss editor showing the William Blake index page"><span class="pin p1">01</span><span class="pin p2">02</span><span class="pin p3">03</span><span class="pin p4">04</span></div><figcaption><ol class="legend"><li><span class="number">01</span><div><strong>Place</strong><p>The breadcrumb names the current collection and page.</p><div class="detail-shot"><img style="--left:0;--top:0" src="../assets/guides/editor-ui-source.png" alt="Enlarged editor breadcrumb"></div></div></li><li><span class="number">02</span><div><strong>Properties</strong><p>The date remains beside the draft.</p><div class="detail-shot"><img style="--left:0;--top:-48px" src="../assets/guides/editor-ui-source.png" alt="Enlarged date property"></div></div></li><li><span class="number">03</span><div><strong>Page</strong><p>The title and writing surface hold the document.</p><div class="detail-shot"><img style="--left:-150px;--top:-105px" src="../assets/guides/editor-ui-source.png" alt="Enlarged writing surface"></div></div></li><li><span class="number">04</span><div><strong>Tools</strong><p>The toolbar applies structure and links.</p><div class="detail-shot toolbar-detail"><img style="--left:-210px;--top:-505px" src="../assets/guides/editor-ui-source.png" alt="Enlarged editor toolbar"></div></div></li></ol></figcaption></figure></main></body></html>
