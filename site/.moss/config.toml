schema_version = 4

[build]
passthrough = ["index.html", "zh-hans/index.html", "zh-hant/index.html", "assets/brand", "assets/platforms", "home"]
[channels.email]

[site]
domain = "mosspub.com"
search = true
ai_policy = "unrestricted"
lang = "en"
rss_footer = false
# Share and Copy on selected text, with each page's QR code: on, as this site has always had them.
selection_tools = true

