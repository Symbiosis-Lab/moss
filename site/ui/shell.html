<body>

    

    
    <div class="moss-app">
      
      <div class="moss-titlebar moss-glass-surface" id="moss-titlebar" data-tauri-drag-region>
        
        <div class="moss-titlebar-traffic-light-space" data-tauri-drag-region></div>

        
        <div class="moss-titlebar-plugin-section" id="moss-titlebar-plugin-section" style="display: none;" data-tauri-drag-region>
          <span class="moss-plugin-title" id="moss-plugin-title" data-tauri-drag-region></span>
        </div>
        <div class="moss-titlebar-divider" id="moss-titlebar-divider" style="display: none;"></div>

        
        <button class="moss-icon-button moss-edit-button moss-glass-pill" id="moss-edit-button" aria-pressed="false" aria-label="Edit page" data-i18n-aria="toolbar.edit_page" data-tooltip="Edit page" data-i18n-tooltip="toolbar.edit_page" data-tooltip-kbd="⌘E">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
          </svg>
        </button>

        
        <span class="moss-env-chip moss-glass-pill" id="moss-env-chip" hidden></span>

        
        <div class="moss-pill-cluster">
          <div class="moss-nav-pill moss-glass-pill">
            <button
              class="moss-nav-button"
              id="btn-nav-back"
              aria-label="Go back"
              data-i18n-aria="toolbar.nav_back"
              disabled
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <span class="moss-url-text" id="moss-url-text">/</span>
            <button
              class="moss-nav-button"
              id="btn-nav-forward"
              aria-label="Go forward"
              data-i18n-aria="toolbar.nav_forward"
              disabled
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 18l6-6-6-6" />
              </svg>
            </button>
          </div>
        </div>

        
        <button
          type="button"
          id="moss-caption-minimize"
          class="moss-caption-btn moss-caption-btn--minimize"
          aria-label="Minimize"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>
        <button
          type="button"
          id="moss-caption-maximize"
          class="moss-caption-btn moss-caption-btn--maximize"
          data-maximized="false"
          aria-label="Maximize"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect class="moss-caption-maximize-icon" x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>
            <path class="moss-caption-restore-icon" d="M2.5 0.5h7v7h-2v-5.5h-5zM0.5 2.5h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>
        <button
          type="button"
          id="moss-caption-close"
          class="moss-caption-btn moss-caption-btn--close"
          aria-label="Close"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>

      </div>

      
      <button
        class="moss-icon-button moss-device-toggle moss-glass-pill"
        data-action="toggle-preview-mode"
        aria-label="Toggle desktop/mobile preview"
        data-i18n-aria="toolbar.device_toggle"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          
          <path
            class="desktop-icon"
            d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H3V4h18v10z"
          />
          
          <path
            class="mobile-icon"
            d="M15.5 1h-8C6.12 1 5 2.12 5 3.5v17C5 21.88 6.12 23 7.5 23h8c1.38 0 2.5-1.12 2.5-2.5v-17C18 2.12 16.88 1 15.5 1zm-4 21c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5-4H7V4h9v14z"
          />
        </svg>
      </button>

      
      <div class="moss-preview-container" id="moss-preview-container">
        
        <div class="moss-ambient-band" id="moss-ambient-band" aria-hidden="true"></div>
        <iframe
          id="moss-preview-iframe"
          title=""
          sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms"
        ></iframe>
        <div id="moss-preview-overlay" class="moss-preview-overlay"></div>
        <div id="moss-preview-find"></div>
        
        <div id="moss-fake-scrollbar" aria-hidden="true">
          <div id="moss-fake-scrollbar-thumb"></div>
        </div>
      </div>

      
      <div class="moss-control-panel-shadow" id="moss-panel-shadow"></div>

      
      <div class="moss-control-panel moss-glass-surface" id="moss-panel">
        
        <button class="moss-settings-button" id="moss-settings-button"
                data-tooltip="Settings" aria-label="Settings"
                data-i18n-tooltip="toolbar.settings" data-i18n-aria="toolbar.settings"

          <svg width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        
        <div class="moss-channel-divider"></div>

        
        <button
          class="moss-syndication-button moss-syndication-button-primary"
          data-platform="website"
          data-tooltip="Website"
          aria-label="Toggle website publishing"
          data-i18n-tooltip="toolbar.website" data-i18n-aria="toolbar.website_toggle"
        ></button>

        
        <div class="moss-syndication-buttons" id="moss-syndication-buttons">
          
        </div>

        
        <div class="moss-channel-divider"></div>

        
        <button class="moss-add-plugin-button" id="moss-add-plugin-button"
                data-tooltip="Add channel" aria-label="Add channel"
                data-i18n-tooltip="toolbar.add_channel" data-i18n-aria="toolbar.add_channel"
                aria-expanded="false">
          
          <svg class="plus-icon" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path class="moss-add-glyph__mk" d="M19,12L5,12" />
            <path class="moss-add-glyph__mk" d="M12,19L12,5" />
          </svg>
        </button>

      </div>

      
      
      
      <button class="moss-publish-button moss-glass-pill" data-action="publish-to-github" disabled aria-label="Publish site" data-i18n-aria="toolbar.publish_site">
        <svg class="moss-publish-icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
          <path d="m21.854 2.147-10.94 10.939"/>
        </svg>
        <svg class="moss-publish-icon-loader" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </button>

    </div>

    
    <div class="moss-command-palette-backdrop" id="command-backdrop"></div>
    <div class="moss-command-palette" id="command-palette">
      
    </div>

    
    <div id="moss-toast-container" role="status" aria-live="polite"></div>

    

    
    <div class="moss-action-panel-spinner-overlay" id="moss-action-panel-spinner" aria-hidden="true">
      <span class="moss-spinner"></span>
    </div>

    <div class="moss-webview-divider" id="moss-webview-divider" aria-hidden="true"></div>

    
    <button class="moss-edge-restore moss-edge-restore--left" id="moss-edge-restore" type="button" hidden
            aria-label="Open editor" data-i18n-aria="toolbar.open_editor">
      <span class="moss-edge-restore__tab" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
    </button>
