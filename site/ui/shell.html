/* ============================================================================
   Inline / Narrator / Awaiting renderers (ADR-015 § Visual language)
   Driven by frontend/app/editor/inline-status.ts,
                frontend/app/editor/narrator.ts,
                frontend/app/editor/awaiting.ts
   ============================================================================ */

/* Inline status badge rules now live in styles/shared/inline-status.css —
   the editor webview needs them too (it holds the `save` anchor) and does not
   import this file. */



/* Notification color classes — consumed by app.ts showNotification() */
.moss-notification-error { background: var(--moss-color-danger); color: var(--moss-pill-filled-text); }
.moss-notification-success { background: var(--moss-success); color: var(--moss-pill-filled-text); }
.moss-notification-info { background: var(--moss-color-accent); color: var(--moss-pill-filled-text); }

/* Phase 5 — Ship progress ring, encircling the publish button (one segment
   per channel). Channel progress, never a recipient count. */
.moss-ship-ring {
  position: absolute;
  inset: -4px;
  width: calc(100% + 8px);
  height: calc(100% + 8px);
  pointer-events: none;
  /* The restyle hairline is painted OUTSIDE the viewBox: 44 units means a
     half-extent of 22 from the centre, and HAIRLINE_R 22.6 with a 1.2 stroke
     spans 22.0–23.2 (ring-geometry.ts). An svg clips to its viewport by
     default, which cut the hairline away at 12/3/6/9 o'clock and left four
     arcs reading as a broken circle (moss#993). The prototype had this
     property and the port dropped it. Enlarging the viewBox instead would
     silently rescale RING_VISUAL_GAP and the linecap-tax arithmetic, which
     are tuned on one viewBox unit being one pixel at a 36px button. Free —
     the element is pointer-events: none. */
  overflow: visible;
}
.moss-ship-ring__track {
  stroke: var(--moss-border-medium, rgba(0, 0, 0, 0.12));
}
/* .moss-ship-ring__caption is an EMPTY span: it exists only as the aria
   progressbar (the SVG is decorative). Its visible "0/1" step counter was
   removed on user request (2026-08-16), following the composition ring's
   number — see the header of composition-ring.ts. No visual rule needed. */
/* Each channel arc — colored by its own recorded outcome. A failed channel
   paints only its own notch red; the rest of the ring keeps its colors.
   Pending (not yet shipped) reads as a faint muted arc over the track. */
.moss-ship-ring__segment {
  stroke: var(--moss-color-text-secondary, rgba(0, 0, 0, 0.35));
  opacity: 0.4;
  transition: stroke 0.25s ease, opacity 0.25s ease;
}
.moss-ship-ring__segment--sent {
  stroke: var(--moss-success, #4a8c4a);
  opacity: 1;
}
.moss-ship-ring__segment--failed {
  stroke: var(--moss-error, #c85450);
  opacity: 1;
}
/* R21: raise to opacity:1 so "skipped" (decided) is perceptually distinct from
   "pending" (0.4 opacity) — same token color but fully opaque reads as resolved. */
.moss-ship-ring__segment--skipped {
  stroke: var(--moss-color-text-secondary, rgba(0, 0, 0, 0.35));
  opacity: 1;
}
/* Publish = verified live (surface correction §2.4): the website segment's
   amber verdict — upload succeeded, site never answered. Lamp vocabulary's
   warning amber (service state), NOT --moss-error (not a send failure). */
.moss-ship-ring__segment--unreachable {
  stroke: var(--moss-warning-amber, #d98500);
  opacity: 1;
}
/* The verification window: the next-pending (website) segment pulses amber
   while the liveness check runs. Glanceable only — the advisory carries the
   words and the elapsed. */
.moss-ship-ring__segment--checking {
  stroke: var(--moss-warning-amber, #d98500);
  animation: moss-ship-ring-checking 1.6s ease-in-out infinite;
}
@keyframes moss-ship-ring-checking {
  0%,
  100% {
    opacity: 0.35;
  }
  50% {
    opacity: 0.9;
  }
}
@media (prefers-reduced-motion: reduce) {
  /* No pulse — a steady mid-opacity amber arc still reads as "deciding"
     against opacity-1 verdict arcs and 0.4 pending arcs. */
  .moss-ship-ring__segment--checking {
    animation: none;
    opacity: 0.65;
  }
}

/* Composition ring — the RESTING ring around the publish button, showing
   what will change BEFORE any publish. Same circle as .moss-ship-ring
   (ring-geometry.ts), time-multiplexed: composition-ring.ts's clear() runs
   before ShipRing.setSegments() so the two never paint at once.

   Verb hues come from --moss-verb-* (tokens.css), which are minted for this
   ring rather than borrowed from the semantic palette. Borrowing was tried
   and is wrong twice over: --moss-success and --moss-color-accent are both
   green, so "added" and "edited" merged into one smear on a 44px ring; and
   --moss-error painted a deleted page in the danger hue, which frames
   deleting a page — an ordinary authoring act — as a failure.

   restyled and the unclassified arc stay hueless at reduced opacity:
   restyled is explicitly a subordinate signal (never an alarm hue, §4.6),
   and "unclassified" is an honest "something changed, no verb known"
   state, not a fourth verb. */
.moss-composition-ring {
  position: absolute;
  inset: -4px;
  width: calc(100% + 8px);
  height: calc(100% + 8px);
  pointer-events: none;
  /* The restyle hairline is painted OUTSIDE the viewBox: 44 units means a
     half-extent of 22 from the centre, and HAIRLINE_R 22.6 with a 1.2 stroke
     spans 22.0–23.2 (ring-geometry.ts). An svg clips to its viewport by
     default, which cut the hairline away at 12/3/6/9 o'clock and left four
     arcs reading as a broken circle (moss#993). The prototype had this
     property and the port dropped it. Enlarging the viewBox instead would
     silently rescale RING_VISUAL_GAP and the linecap-tax arithmetic, which
     are tuned on one viewBox unit being one pixel at a 36px button. Free —
     the element is pointer-events: none. */
  overflow: visible;
}
.moss-composition-ring__arc--added {
  stroke: var(--moss-verb-added, #4a7c4a);
}
.moss-composition-ring__arc--edited {
  stroke: var(--moss-verb-edited, #4a80b8);
}
.moss-composition-ring__arc--deleted {
  stroke: var(--moss-verb-deleted, #b86a66);
}
.moss-composition-ring__arc--neutral {
  stroke: var(--moss-color-text-secondary, rgba(0, 0, 0, 0.35));
  opacity: 0.6;
}
.moss-composition-ring__hairline {
  stroke: var(--moss-color-text-secondary, rgba(0, 0, 0, 0.35));
  opacity: 0.4;
}
</style>
</head>

            d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H3V4h18v10z"

      <div class="moss-control-panel moss-glass-surface" id="moss-panel">

            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>

        <button

    <div class="moss-webview-divider" id="moss-webview-divider" aria-hidden="true"></div>

    <!-- Collapsed-pane edge affordance, left edge — the reopen accelerator for
         the collapsed editor pane
         (docs/archive/2026-08-15-collapsed-pane-edge-affordance.md; what it
         paints today is docs/archive/2026-08-17-collapsed-edge-mark.md).
         Nothing is painted at rest: the 24px strip is invisible and its
         `cursor: pointer` is the whole resting signal. After the 150ms dwell a
         2px muted capsule fades in against the edge, marking the place, and
         with it the chevron below — pointing right, the way the pane unfolds.
         Two tiers of weight, not two states: the chevron carries no opacity
         rule of its own, so it appears wherever the capsule does, the
         collapse-time reveal included. Clicking anywhere in the strip reopens the editor
         at its last width; the titlebar ✎ and ⌘E remain the primary entry
         points. Shown by hideDivider(), hidden by showDivider().

         Deliberately NO data-tooltip. moss's portal tooltip has no dwell — it
         shows on the first `mouseover` — so a tooltip here would paint a solid
         bubble the instant the pointer crossed the invisible 24px column, on
         the way to the traffic lights or into the first character of a line,
         and it would paint it BEFORE the tab it names had begun to fade in.
         That defeats the whole premise ("nothing at rest", "a pass-through
         never strobes") using the one thing that IS painted. The chevron says
         what the bubble said, `aria-label` says it to a screen reader, and the
         titlebar ✎ — visible whenever this strip is armed — still carries the
         ⌘E chip. The right edge omits it for the same reason. -->
    <button class="moss-edge-restore moss-edge-restore--left" id="moss-edge-restore" type="button" hidden
            aria-label="Open editor" data-i18n-aria="toolbar.open_editor">

      </span>

    <svg class="moss-divider-bump-svg" id="moss-divider-bump-svg" aria-hidden="true">

  function renderLive(root){
    root.innerHTML='<h2 class="moss-modal-title">Your site is live</h2>'+
      '<p class="moss-modal-body"><a href="'+url+'" target="_blank" rel="noopener">'+site+'</a></p>'+
      '<div class="moss-modal-actions">'+
      '<button type="button" class="moss-btn moss-btn-secondary" data-action="close">Close</button>'+
      '<a class="moss-btn moss-btn-primary" href="'+url+'" target="_blank" rel="noopener">Visit site</a>'+
      '</div>';
    root.querySelector('[data-action="close"]').addEventListener("click",close);
  }
  function open(){
    if(modal)return;
    backdrop=document.createElement("div");backdrop.className="moss-modal-backdrop";
    backdrop.addEventListener("click",close);
    modal=document.createElement("div");modal.className="moss-modal moss-modal--reverify";
    modal.setAttribute("role","dialog");modal.setAttribute("aria-modal","true");
    modal.addEventListener("click",function(e){e.stopPropagation()});
    var root=document.createElement("div");root.className="lab-publish-modal moss-stack";
    modal.appendChild(root);
    document.body.appendChild(backdrop);document.body.appendChild(modal);
    requestAnimationFrame(function(){backdrop.classList.add("visible");modal.classList.add("visible")});
    T.publishFlash();renderLive(root);
    document.addEventListener("keydown",function onKey(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",onKey)}});
  }
  w.addEventListener("click",open);
})();
document.documentElement.dataset.ready="1";})();
</script>
