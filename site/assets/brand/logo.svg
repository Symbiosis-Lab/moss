<!-- moss mark: one ink splash — 小墨迹/DSCF8983.jpg — read as a palmately lobed
     leaf. The colour is distance, not identity: the far end of every branch,
     and every drop that flew clear of the body, are moss green; the body that
     stayed is black. Nothing is cut, so every boundary in the mark is a real
     gap or a real taper in the ink.
     Pipeline and all variants: Symbiosis-Lab/moss-logo (build-leaf.sh).
     Both inks move under prefers-color-scheme: dark, because a favicon has no
     say over the tab strip it is painted on: the black turns white and the
     green lifts from #4f7031 to #a3d483. Left where it is, the green lands a
     shade above a dark ground beside ink at full white, the two-tone reading
     inverts, and the tips go to a smudge.
     #4f7031 rather than the #6b8e4e this mark replaced: measured, #6b8e4e sits
     midway between black and paper — 5.07x against the ink, 3.53x against the
     paper — so the seam INSIDE the mark is louder than the mark's own outline
     and the silhouette reads as two shapes. #4f7031 turns that around, 3.34x
     and 5.36x, and #a3d483 is the same argument mirrored on dark. This is the
     mark's own pair. The unrelated custom property moss-hl-string keeps
     #8aba6a, which the old mark merely coincided with; the two were never
     one decision.
     The rule keys on the literal rather than a class of its own, because the
     two inline copies of the small mark are retinted the same way from
     stylesheets that cannot reach in here; mark_sync_test holds the three
     in step.
     This file ships verbatim as every site's favicon, so a line added here is a
     line on every published site: the ink deliberately stays #fff where
     mark.css holds the small mark to #ccc, and mark.css's dark block is where
     that is argued. Do not reconcile the two.
     Do NOT rescale the viewBox to shrink this file: the mark is two compound
     paths over a 3145-unit box, and below ~2000 the detached drops and the fine
     tips round away — which is most of what makes it read as a splash. -->
