[workspace]
members = ["crates/moss-core", "crates/moss-build", "crates/moss-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
moss-core = { path = "crates/moss-core", version = "0.21.0" }

[workspace.lints.clippy]
disallowed_methods = "warn"
too_many_lines = "warn"

# CJK-friendly emphasis bridge — moss's FIRST [patch], temporary. Supplies
# Options::ENABLE_CJK_FRIENDLY_EMPHASIS (pulldown-cmark#1059) so `**中文。**后面`
# renders bold instead of a literal `**`. Source = a Symbiosis-Lab fork = the
# v0.13.3 release + only the PR's CJK-emphasis commits, version-bumped to 0.13.5
# so Cargo's [patch] resolves over the 0.13.3 lock. Basing on v0.13.3 (not the
# PR's master base) keeps every other behavior identical to what moss ships —
# no `$`-math / currency drift, no `std`-feature requirement.
# The flag is applied only under moss-core's `cjk-friendly-emphasis` feature
# (the desktop app turns it on); with it off the published moss-core still builds
# against crates.io. RETIRE when #1059 lands + pulldown releases the flag: drop
# this block, `cargo update -p pulldown-cmark`, keep the gated insert.
[patch.crates-io]
pulldown-cmark = { git = "https://github.com/Symbiosis-Lab/pulldown-cmark", rev = "8cd9653dee49cfc242f3aef423b43f15eb0a899d" }

# The profile release assets ship with. opt-level stays 3: "z" and "s" cut a
# few more MB but made site builds slower. Panics keep unwinding because the
# build engine recovers from them with catch_unwind.
[profile.release-optimized]
inherits = "release"
strip = true
lto = "thin"
codegen-units = 1
